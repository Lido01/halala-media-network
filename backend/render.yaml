services:
  - type: web
    name: halala-media-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application

    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8" # 📍 ADD THIS LINE: Enforces Python 3.12 architecture
      - key: ALLOWED_HOSTS
        value: "://onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://netlify.app"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: halala-prod-db
          property: connectionString

